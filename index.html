<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Galeri Video - Caretaker Momen</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
      padding: 0;
    }

    #loadingScreen, #nicknameScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      color: gold;
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
      flex-direction: column;
    }

    #nicknameScreen input {
      font-size: 20px;
      padding: 10px;
      border-radius: 6px;
      border: none;
      margin-top: 20px;
      text-align: center;
    }

    #nicknameScreen button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background: gold;
      color: #000;
      cursor: pointer;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-top: 20px;
    }

    .upload-form {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin: 20px auto;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    .upload-form input, .upload-form textarea, .upload-form button {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .upload-form button {
      background: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .video-card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      border-radius: 6px;
    }

    .description {
      margin-top: 10px;
      font-size: 14px;
    }

    .timestamp {
      font-size: 12px;
      color: #888;
      margin-top: 5px;
    }

    .actions {
      margin-top: 10px;
    }

    .actions button {
      margin-right: 10px;
      padding: 5px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    .like-btn {
      background: #ff4757;
      color: white;
    }

    .comment-box {
      display: flex;
      margin-top: 10px;
    }

    .comment-box input {
      flex: 1;
      padding: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .comment-box button {
      margin-left: 5px;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }

    .comments {
      margin-top: 10px;
      font-size: 13px;
      color: #444;
    }

    .comments p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

<!-- Loading Screen -->
<div id="loadingScreen">CARETAKER MOMEN</div>

<!-- Nickname Screen -->
<div id="nicknameScreen" style="display:none;">
  Masukkan Nickname
  <input type="text" id="nicknameInput" placeholder="Nama Kamu...">
  <button onclick="setNickname()">Lanjut</button>
</div>

<h1 id="welcome" style="display:none;">Galeri Video</h1>

<div class="upload-form" style="display:none;">
  <input type="file" id="videoInput" accept="video/*">
  <textarea id="descInput" placeholder="Deskripsi video..."></textarea>
  <button onclick="uploadVideo()">Upload</button>
</div>

<div class="gallery" id="gallery">
  <!-- Video akan muncul di sini -->
</div>

<script>
  let nickname = localStorage.getItem('nickname');
  const videos = [];

  window.addEventListener('load', function () {
    setTimeout(() => {
      document.getElementById('loadingScreen').style.display = 'none';
      if (!nickname) {
        document.getElementById('nicknameScreen').style.display = 'flex';
      } else {
        showApp();
      }
    }, 10000);
  });

  function setNickname() {
    const input = document.getElementById('nicknameInput').value.trim();
    if (!input) return alert("Isi nickname dulu ya!");
    nickname = input;
    localStorage.setItem('nickname', nickname);
    document.getElementById('nicknameScreen').style.display = 'none';
    showApp();
  }

  function showApp() {
    document.getElementById('welcome').style.display = 'block';
    document.querySelector('.upload-form').style.display = 'block';
    renderGallery();
  }

  function uploadVideo() {
    const fileInput = document.getElementById('videoInput');
    const descInput = document.getElementById('descInput');
    const file = fileInput.files[0];
    const description = descInput.value;

    if (!file) return alert("Pilih video terlebih dahulu");

    const reader = new FileReader();
    reader.onload = function (e) {
      const videoData = {
        src: e.target.result,
        desc: description,
        date: new Date(),
        user: nickname,
        comments: [],
        likedBy: []
      };

      videos.unshift(videoData);
      renderGallery();

      fileInput.value = '';
      descInput.value = '';
    };

    reader.readAsDataURL(file);
  }

  function renderGallery() {
    const gallery = document.getElementById('gallery');
    gallery.innerHTML = '';

    videos.forEach((video, index) => {
      const card = document.createElement('div');
      card.className = 'video-card';

      const formattedDate = video.date.toLocaleString();
      const commentsHtml = video.comments.map(c => `<p><strong>${c.user}:</strong> ${c.text}</p>`).join('');
      const liked = video.likedBy.includes(nickname);

      card.innerHTML = `
        <video controls src="${video.src}"></video>
        <div class="description">${video.desc}</div>
        <div class="timestamp">Oleh <strong>${video.user}</strong> | Diunggah: ${formattedDate}</div>
        <div class="actions">
          <button class="like-btn" onclick="toggleLike(${index}, this)">
            ${liked ? '💖 Liked' : '❤️ Like'}
          </button>
        </div>
        <div class="comments">${commentsHtml}</div>
        <div class="comment-box">
          <input type="text" placeholder="Komentar...">
          <button onclick="postComment(${index}, this)">Kirim</button>
        </div>
      `;

      gallery.appendChild(card);
    });
  }

  function toggleLike(index, btn) {
    const video = videos[index];
    const i = video.likedBy.indexOf(nickname);
    if (i === -1) {
      video.likedBy.push(nickname);
    } else {
      video.likedBy.splice(i, 1);
    }
    renderGallery();
  }

  function postComment(index, button) {
    const input = button.previousElementSibling;
    const text = input.value.trim();
    if (!text) return;

    videos[index].comments.push({ user: nickname, text });
    renderGallery();
  }
</script>

</body>
</html>
